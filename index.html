                                "about.php": { type: "file", content: "<h1>About Intranet</h1><p>This server is running on Windows Server 2019.</p>" },
                                "services.php": { type: "file", content: "<h1>Internal Services</h1><ul><li>Active Directory</li><li>Exchange Server</li><li>File Share (SMB)</li></ul>" },
                                "news.php": { type: "file", content: "<h1>Intranet News</h1><p>System maintenance scheduled for Sunday.</p>" },
                                "careers.php": { type: "file", content: "<h1>Careers</h1><p>Internal job postings only.</p>" },
                                "web.config": { type: "file", content: "<configuration>\n <system.webServer>\n  <directoryBrowse enabled=\"true\" />\n </system.webServer>\n</configuration>" },
                                "img": { type: "dir", children: { "logo.png": {type:"file"} } }
                            }
                        },
                        "apache": { type: "dir", children: { "logs": { type: "dir", children: { "access.log": {type:"file", content: "127.0.0.1 - - \"GET /index.php\" 200"}, "error.log": {type:"file"} } }, "conf": { type: "dir", children: { "httpd.conf": {type:"file", content: "Listen 80\nServerName localhost"} } } } },
                        "php": { type: "dir", children: { "php.ini": {type:"file", content: "display_errors = On\nallow_url_include = On"} } },
                        "mysql": { type: "dir", children: { "bin": {type:"dir", children: {"my.ini": {type:"file", content: "[mysqld]\nport=3306"}}}, "data": { type: "dir", children: { "mysql": {type:"dir"} } } } }
                    }
                },
                "Users": {
                    type: "dir", children: {
                        "Administrator": { type: "dir", children: { "Desktop": { type: "dir", children: { "passwords.txt": {type:"file", content: "admin: SuperSecretPass123!"}, "backup.zip": {type:"file"} } }, "Documents": { type: "dir", children: { "Quarterly_Report.docx": {type:"file"} } }, "Downloads": { type: "dir", children: { "putty.exe": {type:"file"}, "winscp.exe": {type:"file"} } } } },
                        "Public": { type: "dir", children: { "Desktop": { type: "dir", children: {} }, "Documents": {type:"dir"} } },
                        "Guest": { type: "dir", children: { "Desktop": { type: "dir", children: {} } } },
                        "Bob": { type: "dir", children: { "Desktop": {type:"dir", children: {"todo.txt": {type:"file", content: "Update windows"}} }, "Documents": {type:"dir", children: {"ProjectX": {type:"dir"}}}, "Pictures": {type:"dir"} } },
                        "Alice": { type: "dir", children: { "Desktop": {type:"dir"}, "Downloads": {type:"dir", children: {"installer.msi": {type:"file"}}} } }
                    }
                },
                "inetpub": { type: "dir", children: { "wwwroot": { type: "dir", children: { "iisstart.htm": {type:"file", content: "<html><body><h1>IIS Windows Server</h1></body></html>"}, "web.config": {type:"file"} } }, "logs": { type: "dir", children: { "LogFiles": {type:"dir"} } } } }
            }
        };

        // --- 2. State ---
        let activeOS = 'linux';
        let currentPath = []; 
        let currentFS = linuxFS;
        let expandedDirs = new Set();
        let commandHistory = [];
        let historyIndex = -1;
        let webRootLinux = ["var", "www", "html"];
        let webRootWindows = ["xampp", "htdocs"];
        let currentWebRoot = webRootLinux;

        // Elements
        const treeContainer = document.getElementById('file-tree');
        const browserContent = document.getElementById('browser-content');
        const browserUrlInput = document.getElementById('browser-url');
        const cmdInput = document.getElementById('cmd-input');
        const outputLines = document.getElementById('output-lines');
        const promptUser = document.getElementById('prompt-user');
        const promptPath = document.getElementById('prompt-path');

        // --- 3. LFI Logic ---

        function simulateLFI() {
            const urlStr = browserUrlInput.value;
            let paramValue = "";
            let isHome = false;
            
            try {
                const urlObj = new URL(urlStr);
                const params = new URLSearchParams(urlObj.search);
                if (params.has('page')) paramValue = params.get('page');
                else if (params.has('file')) paramValue = params.get('file');
                else isHome = true;
            } catch (e) {
                if (urlStr.includes('=')) paramValue = urlStr.split('=')[1];
                else isHome = true;
            }

            if (isHome) paramValue = "home.php";
            if (!paramValue) paramValue = "home.php";

            // Resolve Path - Split by BOTH / and \
            let searchPath = [...currentWebRoot];
            const parts = paramValue.split(/[/\\]/); 

            for (let part of parts) {
                if (part === '..') {
                    if (searchPath.length > 0) searchPath.pop();
                } else if (part === '.' || part === '') continue;
                else searchPath.push(part);
            }

            // Traverse with Fix
            let ptr = currentFS;
            let found = true;
            for (let folder of searchPath) {
                let targetKey = folder;
                
                // FIX: Windows Case Insensitivity Check
                if (activeOS === 'windows' && ptr.children) {
                    const keys = Object.keys(ptr.children);
                    // Try to find a key that matches case-insensitively
                    const match = keys.find(k => k.toLowerCase() === folder.toLowerCase());
                    if (match) targetKey = match;
                }

                if (ptr.children && ptr.children[targetKey]) {
                    ptr = ptr.children[targetKey];
                } else { 
                    found = false; 
                    break; 
                }
            }

            // Render
            let mainContent = "";
            if (found && ptr.type === 'file') {
                const content = ptr.content || "[Empty]";
                
                if (content.includes('VULNERABLE CODE') || (content.includes('include($page)') && content.includes('$_GET'))) {
                    mainContent = `<div class="p-4 border-l-4 border-red-500 bg-red-50"><h2 class="text-red-700 font-bold">Infinite Loop Warning</h2><p>You cannot include the index file within itself.</p></div>`;
                } 
                else if (content.trim().startsWith('<') || content.includes('<h1>') || content.includes('<body>')) {
                    mainContent = content;
                }
                else {
                    mainContent = `<div class='dump'>${escapeHtml(content)}</div>`;
                }
            } else {
                const pathStr = activeOS === 'linux' ? '/var/www/html/index.php' : 'C:\\xampp\\htdocs\\index.php';
                mainContent = `<div class='p-4 bg-orange-100 text-orange-800 font-mono text-xs border border-orange-300'><b>Warning</b>: include(${escapeHtml(paramValue)}): failed to open stream: No such file or directory in <b>${pathStr}</b> on line <b>3</b><br><b>Warning</b>: include(): Failed opening '${escapeHtml(paramValue)}' for inclusion (include_path='.:/usr/share/php') in <b>${pathStr}</b> on line <b>3</b></div>`;
            }

            const navLinks = [
                {name: "Home", page: "home.php"},
                {name: "News", page: "news.php"},
                {name: "Services", page: "services.php"},
                {name: "Careers", page: "careers.php"},
                {name: "About", page: "about.php"},
                {name: "Contact", page: "contact.php"},
                {name: "Gallery", page: "gallery.php"}
            ];
            
            let navHtml = navLinks.map(link => 
                `<a onclick="navigateToPage('${link.page}')" class="${paramValue === link.page ? 'text-blue-600 font-bold border-b-2 border-blue-600' : 'text-slate-600 hover:text-blue-500'} mr-4 transition-all pb-1 no-underline border-b-transparent hover:border-blue-300">${link.name}</a>`
            ).join('');

            browserContent.innerHTML = `
                <div class="sim-site min-h-full flex flex-col bg-white">
                    <nav class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10">
                        <div class="flex items-center gap-2 font-bold text-xl text-slate-800 cursor-pointer" onclick="navigateToPage('home.php')">
                            <i class="fa-solid fa-shield-halved text-blue-600"></i> SecureCorp
                        </div>
                        <div class="text-sm font-medium flex flex-wrap gap-y-2">${navHtml}</div>
                    </nav>
                    <main class="flex-1 p-8 max-w-4xl mx-auto w-full">${mainContent}</main>
                    <footer class="bg-slate-50 border-t border-slate-200 p-6 text-center text-slate-400 text-xs">
                        &copy; 2023 SecureCorp Inc. All rights reserved. <br>
                        Powered by ${activeOS === 'linux' ? 'PHP/7.4.3 on Ubuntu' : 'PHP/8.0 on Windows Server'}
                    </footer>
                </div>
            `;
        }

        function navigateToPage(page) {
            const baseUrl = activeOS === 'linux' ? 'http://lfi.lab/index.php' : 'http://win-server.local/index.php';
            browserUrlInput.value = `${baseUrl}?page=${page}`;
            reloadBrowser();
        }

        function reloadBrowser() {
            browserContent.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-slate-400 bg-white"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i><span class="font-mono text-xs">Connecting...</span></div>`;
            setTimeout(simulateLFI, 300);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        browserUrlInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') reloadBrowser(); });

        function init() {
            activeOS = 'linux'; currentFS = linuxFS; currentWebRoot = webRootLinux; expandedDirs.add('root');
            updatePrompt(); reloadBrowser(); cmdInput.focus();
        }

        function hardReset() { location.reload(); }

        function switchOS(os) {
            activeOS = os; currentPath = []; expandedDirs.clear();
            const btnLinux = document.getElementById('btn-linux');
            const btnWindows = document.getElementById('btn-windows');

            if (os === 'linux') {
                currentFS = linuxFS; currentWebRoot = webRootLinux; expandedDirs.add('root');
                promptUser.innerText = 'root@box:';
                browserUrlInput.value = "http://lfi.lab/index.php?page=home.php";
                document.getElementById('server-signature').innerText = "Apache/2.4.41 (Ubuntu)";
                btnLinux.classList.replace('text-slate-400', 'text-white'); btnLinux.classList.replace('bg-transparent', 'bg-emerald-600');
                btnWindows.classList.replace('text-white', 'text-slate-400'); btnWindows.classList.replace('bg-blue-600', 'bg-transparent');
            } else {
                currentFS = windowsFS; currentWebRoot = webRootWindows; expandedDirs.add('C:');
                promptUser.innerText = 'C:\\>';
                browserUrlInput.value = "http://win-server.local/index.php?page=home.php";
                document.getElementById('server-signature').innerText = "IIS/10.0 (Windows Server 2019)";
                btnWindows.classList.replace('text-slate-400', 'text-white'); btnWindows.classList.replace('bg-transparent', 'bg-blue-600');
                btnLinux.classList.replace('text-white', 'text-slate-400'); btnLinux.classList.replace('bg-emerald-600', 'bg-transparent');
            }
            reloadBrowser(); updatePrompt();
        }

        function collapseAll() { expandedDirs.clear(); if (activeOS === 'linux') expandedDirs.add('root'); else expandedDirs.add('C:'); renderTree(); }

        function renderTree() {
            treeContainer.innerHTML = buildTreeHTML(currentFS, [], activeOS === 'linux' ? '/' : 'C:\\', activeOS === 'linux' ? 'root' : 'C:');
        }

        function buildTreeHTML(node, pathArr, label, uniqueKey) {
            const isCurrentDir = JSON.stringify(pathArr) === JSON.stringify(currentPath);
            const isExpanded = expandedDirs.has(uniqueKey);
            const hasChildren = node.type === 'dir' && node.children && Object.keys(node.children).length > 0;
            const depth = pathArr.length;
            const paddingLeft = depth * 12 + 4;
            
            let icon = 'fa-folder'; let iconColor = 'text-blue-400';
            if (node.type === 'file') {
                icon = 'fa-file-code'; iconColor = 'text-slate-500';
                if(label.endsWith('.php')) iconColor = 'text-purple-400';
                if(label.endsWith('.txt')) iconColor = 'text-gray-400';
                if(label.endsWith('.ini')) iconColor = 'text-yellow-400';
                if(label.endsWith('.log')) iconColor = 'text-amber-600';
            } else { if (isCurrentDir) iconColor = 'text-emerald-400'; }

            let toggleHtml = hasChildren && node.type === 'dir'
                ? `<i onclick="toggleExpand('${uniqueKey}', event)" class="fa-solid ${isExpanded ? 'fa-caret-down' : 'fa-caret-right'} w-4 text-center text-slate-500 hover:text-white transition-colors mr-1"></i>`
                : `<span class="w-4 mr-1 inline-block"></span>`;

            const separator = activeOS === 'linux' ? '/' : '\\\\'; 
            const pathStr = pathArr.join(separator); 
            
            let html = `
                <div class="tree-item flex items-center py-0.5 cursor-pointer rounded-sm">
                    <div style="padding-left: ${paddingLeft}px" class="flex items-center w-full">
                        ${toggleHtml}
                        <div class="flex items-center flex-1" onclick="handleNameClick('${uniqueKey}', '${pathStr}', '${node.type}')">
                            <i class="fa-solid ${icon} ${iconColor} mr-2 text-[10px]"></i>
                            <span class="${isCurrentDir ? 'text-white font-bold' : ''}">${label}</span>
                        </div>
                    </div>
                </div>
            `;

            if (node.type === 'dir' && hasChildren && isExpanded) {
                const keys = Object.keys(node.children).sort((a, b) => {
                    const typeA = node.children[a].type === 'dir' ? 0 : 1;
                    const typeB = node.children[b].type === 'dir' ? 0 : 1;
                    if (typeA !== typeB) return typeA - typeB;
                    return a.localeCompare(b);
                });
                keys.forEach(key => { html += buildTreeHTML(node.children[key], [...pathArr, key], key, uniqueKey + '|' + key); });
            }
            return html;
        }

        window.toggleExpand = function(key, event) { event.stopPropagation(); if (expandedDirs.has(key)) expandedDirs.delete(key); else expandedDirs.add(key); renderTree(); }

        window.handleNameClick = function(key, pathStr, type) {
            if (type === 'dir') {
                const separator = activeOS === 'linux' ? '/' : '\\';
                currentPath = pathStr.split(separator).filter(p => p !== "");
                if (!expandedDirs.has(key)) expandedDirs.add(key);
                updatePrompt();
            } else { printLine(`User selected file: ${pathStr}`, "text-gray-500 italic"); }
        }

        function getCurrentDirObj() {
            let ptr = currentFS;
            for (const folder of currentPath) {
                if (ptr.children && ptr.children[folder]) ptr = ptr.children[folder]; else return null;
            }
            return ptr;
        }

        // Fix 2: Robust CD Path Resolver
        function resolvePath(pathStr) {
            let tempPath = [...currentPath];
            if (activeOS === 'linux' && pathStr.startsWith('/')) { tempPath = []; pathStr = pathStr.substring(1); }
            else if (activeOS === 'windows' && (pathStr.startsWith('C:') || pathStr.startsWith('\\'))) { tempPath = []; pathStr = pathStr.replace(/^C:\\|^C:|^\\/i, ''); }
            
            if (!pathStr) return tempPath;

            const parts = pathStr.split(/[/\\]/); 

            for (let part of parts) {
                if (part === '.' || part === '') continue;
                if (part === '..') { if (tempPath.length > 0) tempPath.pop(); } 
                else {
                    let ptr = currentFS;
                    for(let p of tempPath) ptr = ptr.children[p];
                    if (ptr && ptr.type === 'dir' && ptr.children && ptr.children[part]) { tempPath.push(part); } else { return null; }
                }
            }
            return tempPath;
        }

        function updatePrompt() {
            let pathStr = activeOS === 'linux' ? '/' + currentPath.join('/') : 'C:\\' + currentPath.join('\\');
            promptPath.innerText = pathStr;
            renderTree();
        }

        function printLine(text, className = "text-slate-300") {
            const div = document.createElement('div');
            div.className = className + " whitespace-pre-wrap break-words";
            div.innerHTML = text;
            outputLines.appendChild(div);
        }

        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const val = this.value.trim();
                if (val) { processCommand(val); commandHistory.push(val); historyIndex = commandHistory.length; }
                this.value = ''; terminalOutput = document.getElementById('terminal-output'); terminalOutput.scrollTop = terminalOutput.scrollHeight;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault(); if (historyIndex > 0) { historyIndex--; this.value = commandHistory[historyIndex]; }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault(); if (historyIndex < commandHistory.length - 1) { historyIndex++; this.value = commandHistory[historyIndex]; } else { historyIndex = commandHistory.length; this.value = ''; }
            }
        });

        function processCommand(rawCmd) {
            const separator = activeOS === 'linux' ? '/' : '\\';
            const promptSymbol = activeOS === 'linux' ? '$' : '>';
            printLine(`${promptUser.innerText} ${promptPath.innerText} ${promptSymbol} ${rawCmd}`, "text-slate-400 font-bold opacity-75 mt-1");

            const args = rawCmd.split(' ').filter(a => a !== "");
            const cmd = args[0]?.toLowerCase();

            if (cmd === 'clear' || cmd === 'cls') { outputLines.innerHTML = ''; return; }
            if (cmd === 'help') { printLine("Admin Tools: ls, cd, cat, clear, whoami, pwd", "text-yellow-400"); return; }
            if (cmd === 'whoami') { printLine("root", "text-white"); return; }
            if (cmd === 'pwd') { printLine(activeOS === 'linux' ? '/' + currentPath.join('/') : 'C:\\' + currentPath.join('\\'), "text-white"); return; }

            if (cmd === 'ls' || cmd === 'dir') {
                const dir = getCurrentDirObj();
                if (!dir || dir.type !== 'dir') { printLine("Err: Directory not found", "text-red-400"); return; }
                const items = Object.keys(dir.children || {}).map(k => dir.children[k].type === 'dir' ? `<span class='text-blue-400'>${k}${separator}</span>` : `<span class='text-slate-300'>${k}</span>`);
                printLine(items.join('\t') || "(empty)", "");
                return;
            }

            if (cmd === 'cd') {
                if (!args[1]) return;
                const newPath = resolvePath(args[1]);
                if (newPath) {
                    currentPath = newPath;
                    let key = activeOS === 'linux' ? 'root' : 'C:';
                    expandedDirs.add(key); for(let p of newPath) { key += '|' + p; expandedDirs.add(key); }
                    updatePrompt();
                } else { printLine("Err: Path not found", "text-red-400"); }
                return;
            }

            if (cmd === 'cat' || cmd === 'type') {
                if (!args[1]) { printLine("Usage: cat <file>", "text-yellow-400"); return; }
                let targetPath = resolvePath(args[1]);
                if (!targetPath) {
                    let dir = getCurrentDirObj();
                    if(dir.children && dir.children[args[1]] && dir.children[args[1]].type === 'file') {
                        printLine(escapeHtml(dir.children[args[1]].content || ""), "text-white"); return;
                    }
                    printLine("Err: File not found", "text-red-400"); return;
                }
                let ptr = currentFS; for(let p of targetPath) ptr = ptr.children[p];
                if (ptr.type === 'file') { printLine(escapeHtml(ptr.content || ""), "text-white"); } else { printLine("Err: Is a directory", "text-red-400"); }
                return;
            }
            printLine(`Unknown command: ${cmd}`, "text-red-400");
        }

        init();
    </script>
